<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="100%" role="img" aria-labelledby="t d" fill="currentColor"><title id="t">The enrich exchange on every cold start</title><desc id="d">Strongbox and Superwall: to the service: POST /api/v1/enrich a device profile; back to the app: ipCountry, ipRegion, ipCity, ipContinent, ipV4, ipV4ObservedAt, demandScore, demandTier; to the service: the same values, in later events: device_attributes, enrichment_complete; demand score and tier also in paywall_open.</desc><style>svg{color:#16140F;font-family:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}.svg-sub{fill:#5B5648}.svg-rule{stroke:#5B5648}.bg{fill:#FFFFFF}</style><rect class="bg" x="0" y="0" width="760" height="324"/><text x="20" y="26" font-size="11" letter-spacing="1.2" class="svg-sub">ON YOUR DEVICE</text><text x="420" y="26" font-size="11" letter-spacing="1.2" class="svg-sub">LEAVES YOUR DEVICE</text><line x1="400" y1="14" x2="400" y2="316" class="svg-rule" stroke-width="1" stroke-dasharray="2 4"></line><text x="20" y="190" font-size="15" font-weight="600">Strongbox</text><text x="20" y="210" font-size="12" class="svg-sub">every cold start</text><text x="516" y="190" font-size="14" font-weight="600">Superwall</text><text x="516" y="210" font-size="12" class="svg-sub">enrichment-api, collector</text><g><path d="M145.2,96 L498,96" fill="none" stroke="currentColor" stroke-width="1.5"></path><path d="M0,0.75 L-11,-5 L-8,-0.75 L-8,0.75 Z" transform="translate(506,96)"></path><text x="165.2" y="70" font-size="12">POST /api/v1/enrich</text><text x="165.2" y="86" font-size="12">a device profile</text></g><g><path d="M506,190 L153.2,190" fill="none" stroke="currentColor" stroke-width="1.5"></path><path d="M0,0.75 L-11,-5 L-8,-0.75 L-8,0.75 Z" transform="translate(145.2,190) rotate(180)"></path><text x="165.2" y="148" font-size="12">ipCountry, ipRegion, ipCity, ipContinent,</text><text x="165.2" y="164" font-size="12">ipV4, ipV4ObservedAt,</text><text x="165.2" y="180" font-size="12">demandScore, demandTier</text></g><g><path d="M145.2,284 L498,284" fill="none" stroke="currentColor" stroke-width="1.5"></path><path d="M0,0.75 L-11,-5 L-8,-0.75 L-8,0.75 Z" transform="translate(506,284)"></path><text x="165.2" y="242" font-size="12">the same values, in later events:</text><text x="165.2" y="258" font-size="12">device_attributes, enrichment_complete;</text><text x="165.2" y="274" font-size="12">demand score and tier also in paywall_open</text></g></svg>
